; Disk stress demo config
; imagePath: single source image file, support relative path
; imageDir: source image folder, support relative path, when not empty it takes priority over imagePath
; pixelMode: auto / gray / color, auto will detect each source image and keep grayscale or color
; preloadImageCount: preload only first N images from imageDir into memory, then loop them
; rootDir: output root dir, support relative path
; saveMode: single or pack
; fps / totalCount / durationSec control test speed and stop condition
; jpegQueueMaxMB: pending JPG queue memory limit, 0 means unlimited

[input]
imagePath=.\test.jpg
imageDir=
pixelMode=auto
preloadImageCount=30

[output]
rootDir=.\output
saveMode=pack

[stress]
fps=1
totalCount=0
durationSec=0
threadCount=4
poolBlockCount=80
jpegQuality=80
logIntervalMs=1000
jpegQueueMaxMB=0

[pack]
packMaxMB=800
packFlushEvery=20
